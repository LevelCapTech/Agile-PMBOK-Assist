name: issue-assigned-screenshot

on:
  issues:
    types: [assigned]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/copilot-setup-steps.yml
    with:
      node-version: "20"
      working-directory: "."
      install-playwright-browsers: true

      # ★これを追加（4201の根絶）
      port: 4000

      build-command: "npm run build"

      # ★これに統一（PORT env に任せる）
      start-command: "npm run start -- -p 4000"

      # ★スクショ不要なら true のまま
      screenshot-command: "true"

      upload-artifacts: true