name: "Copilot 環境準備（setup steps）"

on:
  workflow_dispatch:
  # push: 西山がレビューで却下、文字化けしたらコメントアウト解除
  # pull_request: 西山がレビューで却下、文字化けしたらコメントアウト解除

permissions:
  contents: read

concurrency:
  group: copilot-setup-steps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Install Japanese fonts (always)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-ipafont-gothic fonts-ipafont-mincho \
            fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f
