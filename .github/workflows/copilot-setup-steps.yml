name: copilot-setup-steps

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "20"
      working-directory:
        required: false
        type: string
        default: "."
      install-playwright-browsers:
        required: false
        type: boolean
        default: true
      port:
        required: false
        type: number
        default: 4201
      start-command:
        required: false
        type: string
        default: "npm run start -- --port ${{ inputs.port }}"
      build-command:
        required: false
        type: string
        default: "npm run build"
      screenshot-command:
        required: false
        type: string
        default: "npm run screenshot"
      upload-artifacts:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Copilot Coding Agent の Custom setup steps は
  # "copilot-setup-steps" という **単一ジョブ名** を要求する
  copilot-setup-steps:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      # Playwright ブラウザキャッシュ（超効く）
      - name: Cache Playwright browsers
        if: ${{ inputs.install-playwright-browsers }}
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-pw-

      - name: Install deps (npm ci)
        run: npm ci

      # キャッシュミスの時だけ Playwright を入れる（ここが時短のキモ）
      - name: Install Playwright browsers (only when cache-miss)
        if: ${{ inputs.install-playwright-browsers && steps.pw-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps

      - name: Build
        run: ${{ inputs.build-command }}

      # start-command に --port / -p が含まれると inputs.port とズレることがある。
      # ヘルスチェック等は "実際に起動するポート" を優先して見る。
      - name: Resolve effective port
        id: effective-port
        run: |
          cmd='${{ inputs.start-command }}'
          if [[ "$cmd" =~ (--port|-p)[[:space:]]*([0-9]+) ]]; then
            port="${BASH_REMATCH[2]}"
          else
            port='${{ inputs.port }}'
          fi
          echo "port=$port" >> "$GITHUB_OUTPUT"

      # ★おまけ：ポート競合チェック（並列や既存プロセス事故を早期検知）
      - name: Check port availability
        run: |
          if command -v lsof >/dev/null 2>&1; then
            p='${{ steps.effective-port.outputs.port }}'
            if lsof -iTCP:${p} -sTCP:LISTEN -n -P >/dev/null 2>&1; then
              echo "Port ${p} is already in use."
              lsof -iTCP:${p} -sTCP:LISTEN -n -P || true
              exit 1
            fi
          fi

      - name: Start server (background)
        run: |
          nohup ${{ inputs.start-command }} > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid

      - name: Wait for server
        run: |
          for i in {1..60}; do
            p='${{ steps.effective-port.outputs.port }}'
            curl -fsS "http://localhost:${p}" >/dev/null && exit 0
            sleep 1
          done
          echo "Server did not start"
          tail -n 200 /tmp/app.log || true
          exit 1

      - name: Take screenshot
        run: ${{ inputs.screenshot-command }}

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/app.pid ]; then
            kill "$(cat /tmp/app.pid)" || true
          fi

      - name: Upload artifacts
        if: ${{ inputs.upload-artifacts && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-logs
          path: |
            ${{ inputs.working-directory }}/playwright-report/**
            ${{ inputs.working-directory }}/test-results/**
            /tmp/app.log