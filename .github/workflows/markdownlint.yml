name: Markdown lint（reviewdog）

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**/*.md"
      - ".github/**/*.md"
  push:
    paths:
      - "docs/**/*.md"
      - ".github/**/*.md"

permissions:
  contents: read

concurrency:
  group: markdownlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install tools
        run: npm install -g markdownlint-cli@0.48.0

      - name: Install reviewdog
        run: |
          go install github.com/reviewdog/reviewdog/cmd/reviewdog@v0.21.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Markdown lint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # パイプ演算子（|）を使用していないため pipefail は省略
          exit_code=0
          markdownlint "docs/**/*.md" ".github/**/*.md" > markdownlint.txt || exit_code=$?
          reviewdog_exit=0
          reviewdog < markdownlint.txt \
            -f=markdownlint \
            -name="Markdownチェック" \
            -reporter="github-pr-review" \
            -level=warning || reviewdog_exit=$?
          # markdownlint: 1=lint違反, 2以上=実行エラー
          # reviewdog: 0=成功（PRコメント/チェックの投稿が成功）
          if [ "$reviewdog_exit" -ne 0 ]; then
            echo "reviewdog failed with exit code ${reviewdog_exit}"
            exit "$reviewdog_exit"
          fi
          # exit_code=1 は reviewdog で通知済みのため成功扱い
          if [ "$exit_code" -gt 1 ]; then
            echo "markdownlint failed with exit code ${exit_code}"
            exit "$exit_code"
          fi

  markdownlint-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install tools
        run: npm install -g markdownlint-cli@0.48.0

      - name: Install reviewdog
        run: |
          go install github.com/reviewdog/reviewdog/cmd/reviewdog@v0.21.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Markdown lint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # パイプ演算子（|）を使用していないため pipefail は省略
          exit_code=0
          markdownlint "docs/**/*.md" ".github/**/*.md" > markdownlint.txt || exit_code=$?
          reviewdog_exit=0
          reviewdog < markdownlint.txt \
            -f=markdownlint \
            -name="Markdownチェック" \
            -reporter="github-check" \
            -level=warning || reviewdog_exit=$?
          # markdownlint: 1=lint違反, 2以上=実行エラー
          # reviewdog: 0=成功（PRコメント/チェックの投稿が成功）
          if [ "$reviewdog_exit" -ne 0 ]; then
            echo "reviewdog failed with exit code ${reviewdog_exit}"
            exit "$reviewdog_exit"
          fi
          # exit_code=1 は reviewdog で通知済みのため成功扱い
          if [ "$exit_code" -gt 1 ]; then
            echo "markdownlint failed with exit code ${exit_code}"
            exit "$exit_code"
          fi
