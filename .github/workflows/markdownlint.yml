name: Markdown lint（reviewdog）

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**/*.md"
      - ".github/**/*.md"
  push:
    paths:
      - "docs/**/*.md"
      - ".github/**/*.md"

permissions:
  contents: read

concurrency:
  group: markdownlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install tools
        run: npm install -g markdownlint-cli@0.48.0

      - name: Install reviewdog
        run: |
          go install github.com/reviewdog/reviewdog/cmd/reviewdog@v0.21.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Markdown lint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          markdownlint "docs/**/*.md" ".github/**/*.md" > markdownlint.txt || true
          reviewdog < markdownlint.txt \
            -f=markdownlint \
            -name="Markdownチェック" \
            -reporter="github-pr-review" \
            -level=warning

  markdownlint-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install tools
        run: npm install -g markdownlint-cli@0.48.0

      - name: Install reviewdog
        run: |
          go install github.com/reviewdog/reviewdog/cmd/reviewdog@v0.21.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Markdown lint
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          markdownlint "docs/**/*.md" ".github/**/*.md" > markdownlint.txt || true
          reviewdog < markdownlint.txt \
            -f=markdownlint \
            -name="Markdownチェック" \
            -reporter="github-check" \
            -level=warning
