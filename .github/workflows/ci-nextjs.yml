name: CI（Next.js / Node 24）

on:
  pull_request:
    paths-ignore:
      - "mock/**"
  push:
    branches: [main]
    paths-ignore:
      - "mock/**"
  workflow_dispatch:
    inputs:
      runTests:
        description: "Run tests"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read

concurrency:
  group: nextjs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUN_TESTS: ${{ github.event.inputs.runTests || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Test (E2E)
        run: npm run test:e2e

      - name: Build Storybook
        run: npm run build-storybook

      - name: Test Storybook stories
        run: |
          set -e
          python -m http.server 6006 --directory storybook-static --bind 127.0.0.1 &
          STORYBOOK_PID=$!
          trap "kill $STORYBOOK_PID" EXIT
          for i in {1..10}; do
            if curl -fs http://127.0.0.1:6006 > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fs http://127.0.0.1:6006 > /dev/null; then
            echo "Storybook server did not become ready on port 6006."
            exit 1
          fi
          npx --no-install test-storybook --url http://127.0.0.1:6006

      - name: Publish to Chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitOnceUploaded: true
