name: CI（Next.js / Node 24）

on:
  pull_request:
    paths-ignore:
      - "mock/**"
  push:
    branches: [main]
    paths-ignore:
      - "mock/**"
  workflow_dispatch:
    inputs:
      runTests:
        description: "Run tests"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read

concurrency:
  group: nextjs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUN_TESTS: ${{ github.event.inputs.runTests || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build generated CSS
        run: npm run build:generated-css

      - name: Lint generated CSS
        run: npm run lint:generated-css

      - name: Test
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Test (E2E)
        run: npm run test:e2e

      - name: Build Storybook
        run: npm run build-storybook
