name: CI（Next.js / Node 24）

on:
  pull_request:
    paths-ignore:
      - "mock/**"
  push:
    branches: [main]
    paths-ignore:
      - "mock/**"
  workflow_dispatch:
    inputs:
      runTests:
        description: "Run tests"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read

concurrency:
  group: nextjs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stylelint-generated-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Fetch through merge-base
        if: github.event_name == 'pull_request'
        uses: fulcrumgenomics/fetch-through-merge-base@v1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build generated CSS
        run: |
          mkdir -p .ci-artifacts
          npx tailwindcss -i app/globals.css -o .ci-artifacts/generated.css --minify

      - name: Run stylelint on generated CSS
        run: |
          npx stylelint .ci-artifacts/generated.css || {
            echo "STYLE_LINT_FAILED: .ci-artifacts/generated.css を確認し、app/globals.css と Tailwind レイヤー定義から逆引きしてください。"
            exit 1
          }

  build:
    runs-on: ubuntu-latest
    env:
      RUN_TESTS: ${{ github.event.inputs.runTests || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Fetch through merge-base
        if: github.event_name == 'pull_request'
        uses: fulcrumgenomics/fetch-through-merge-base@v1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Test (E2E)
        run: npm run test:e2e

      - name: Build Storybook
        run: npm run build-storybook

      - name: Test Storybook stories
        run: |
          set -e
          python -m http.server 6006 --directory storybook-static --bind 127.0.0.1 &
          STORYBOOK_PID=$!
          trap "kill $STORYBOOK_PID" EXIT
          MAX_RETRIES=10
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -fs http://127.0.0.1:6006 > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fs http://127.0.0.1:6006 > /dev/null; then
            echo "Storybook server did not become ready on port 6006 after ${MAX_RETRIES} attempts. Check for port conflicts or server startup issues."
            exit 1
          fi
          echo "Storybook server ready. Running Storybook tests..."
          npx test-storybook --url http://127.0.0.1:6006 || { echo "Storybook tests failed."; exit 1; }
        shell: bash

      - name: Publish to Chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitOnceUploaded: true
