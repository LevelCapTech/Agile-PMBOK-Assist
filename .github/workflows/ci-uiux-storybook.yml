name: CI（UI/UX Storybookゲート）

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      runChromatic:
        description: "Run Chromatic publish"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read

concurrency:
  group: uiux-storybook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storybook-gate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, '📕 UI/UX')
    runs-on: ubuntu-latest
    env:
      RUN_CHROMATIC: ${{ github.event.inputs.runChromatic || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Fetch through merge-base
        if: github.event_name == 'pull_request'
        uses: fulcrumgenomics/fetch-through-merge-base@v1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Storybook
        run: npm run build-storybook

      - name: Test Storybook stories
        run: |
          set -e
          python -m http.server 6006 --directory storybook-static --bind 127.0.0.1 &
          STORYBOOK_PID=$!
          trap "kill $STORYBOOK_PID" EXIT
          MAX_RETRIES=10
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -fs http://127.0.0.1:6006 > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -fs http://127.0.0.1:6006 > /dev/null; then
            echo "Storybook server did not become ready on port 6006 after ${MAX_RETRIES} attempts. Check for port conflicts or server startup issues."
            exit 1
          fi
          echo "Storybook server ready. Running Storybook tests..."
          npx test-storybook --url http://127.0.0.1:6006 || { echo "Storybook tests failed."; exit 1; }
        shell: bash

      - name: Publish to Chromatic
        if: env.RUN_CHROMATIC == 'true' && secrets.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitOnceUploaded: true
