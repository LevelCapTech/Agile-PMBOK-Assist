name: Mermaid lint（reviewdog）

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**/*.md"
      - ".github/**/*.md"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mermaid-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mermaid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install tools
        run: npm install -g @mermaid-js/mermaid-cli@11.12.0

      - name: Install reviewdog
        run: |
          go install github.com/reviewdog/reviewdog/cmd/reviewdog@v0.21.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Extract Mermaid blocks
        run: |
          echo "Mermaidブロック抽出を開始します" >&2
          mkdir -p tmp
          node <<'EOF'
          const fs = require('fs')
          const path = require('path')

          // Mermaidブロックの対応表
          const mapPath = path.join('tmp', 'map.txt')
          fs.writeFileSync(mapPath, '')

          // Mermaidブロックの件数
          let index = 0

          // 指定ディレクトリ以下のMarkdownを探索
          function walk(dir) {
            if (!fs.existsSync(dir)) return
            fs.readdirSync(dir).forEach((entry) => {
              const full = path.join(dir, entry)
              const stat = fs.statSync(full)
              if (stat.isDirectory()) {
                walk(full)
                return
              }
              if (full.endsWith('.md')) {
                processFile(full)
              }
            })
          }

          function processFile(file) {
            const lines = fs.readFileSync(file, 'utf8').split('\n')
            let inside = false
            let buffer = []
            let startLine = 0

            lines.forEach((line, idx) => {
              const trimmed = line.trim()
              // Mermaidブロックの開始
              if (!inside && trimmed.startsWith('```mermaid')) {
                inside = true
                buffer = []
                startLine = idx + 1
                return
              }

              // Mermaidブロックの終了
              if (inside && trimmed.startsWith('```')) {
                inside = false
                const name = `tmp/diagram-${++index}.mmd`
                fs.writeFileSync(name, buffer.join('\n'))
                fs.appendFileSync(mapPath, `${name}:${file}:${startLine}\n`)
                return
              }

              if (inside) buffer.push(line)
            })
          }

          walk('docs')
          walk('.github')
          console.log(`抽出したMermaid図: ${index}件`)
          EOF
          echo "Mermaidブロック抽出が完了しました" >&2

      - name: Validate Mermaid diagrams
        run: |
          echo "Mermaid図の検証を開始します" >&2
          echo "Puppeteer設定ファイルを生成します" >&2
          : > tmp/result.txt
          MAX_ERROR_LENGTH=500
          cat <<'JSON' > tmp/puppeteer-config.json
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox"]
          }
          JSON
          if [ -s tmp/map.txt ]; then
            while IFS=":" read -r mmd src line; do
              if [ -z "${mmd}" ]; then
                continue
              fi
              if ! output=$(mmdc -p tmp/puppeteer-config.json -i "${mmd}" -o "${mmd}.svg" 2>&1); then
                summary=$(printf "%s" "${output}" | tr '\n' ' ' | cut -c1-${MAX_ERROR_LENGTH})
                echo "${src}:${line}: Mermaid図の構文検証に失敗しました: ${summary}" >> tmp/result.txt
              fi
            done < tmp/map.txt
          else
            echo "Mermaidブロックが見つからなかったため検証をスキップします" >&2
          fi
          echo "Mermaid図の検証が完了しました" >&2

      - name: Report via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "reviewdogで結果を通知します" >&2
          reviewdog < tmp/result.txt \
            -efm="%f:%l: %m" \
            -name="Mermaid図チェック" \
            -reporter=github-pr-review \
            -level=error
